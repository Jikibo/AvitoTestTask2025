version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pr_reviewer_db
    environment:
      POSTGRES_USER: pruser
      POSTGRES_PASSWORD: prpassword
      POSTGRES_DB: pr_reviewer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pruser -d pr_reviewer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pr_reviewer_service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pruser:prpassword@postgres:5432/pr_reviewer_db?sslmode=disable
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
